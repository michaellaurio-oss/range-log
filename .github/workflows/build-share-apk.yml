# Builds the share version of Range Log (com.laurio.rangelog.share): no preloaded history, no Firebase.
# Every push that changes the app builds it; the APK is attached to the run under "Artifacts".
# Pushing a tag like share-v1.0 also publishes it as a GitHub Release with the APK attached.
#
# Signing: add these repo secrets (Settings > Secrets and variables > Actions) to sign with the share key:
#   SHARE_KEYSTORE_BASE64  the .jks file as base64 text
#   SHARE_STORE_PASSWORD, SHARE_KEY_ALIAS, SHARE_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key: fine to try, but it can't update a
# properly signed install, so don't hand that one out.
name: Build share APK

on:
  push:
    branches: ['**']
    tags: ['share-v*'] # tag pushes always build; GitHub ignores the paths list for tags
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-share-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the build number is the commit count

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the release key (when the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.SHARE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHARE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHARE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set, so this APK uses a debug key. Fine for testing, not for sharing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > share-release.jks
          printf 'storeFile=share-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: bash ./gradlew --no-daemon assembleShareRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/share/release/app-share-release.apk "out/RangeLogger-1.0.$(git rev-list --count HEAD).apk"
          ls -l out

      - name: Show who signed it
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs out/*.apk | grep -E 'DN|SHA-256'
          echo "Compare with share-signing-key/fingerprint.txt on the PC (same digest, written with colons there)."

      - uses: actions/upload-artifact@v5
        with:
          name: RangeLog-share-apk
          path: out/*.apk

  release:
    # Separate job so only publishing a Release gets permission to write to the repo.
    needs: build
    if: startsWith(github.ref, 'refs/tags/share-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: RangeLog-share-apk
          path: out
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk --repo "$GITHUB_REPOSITORY" \
            --title "Range Logger $GITHUB_REF_NAME" \
            --notes "Android only. Download the APK on the phone, tap it, and allow installing from this source when asked."
